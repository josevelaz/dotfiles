# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version: 2
final_space: true
auto_upgrade: true
blocks:
- type: prompt
  alignment: left
  segments:
  - type: executiontime
    style: diamond
    leading_diamond: 
    trailing_diamond: "\ue0b4 "
    template: "{{ .FormattedMs }}"
    properties:
      style: austin
      threshold: 150.0
    background: "#29315A"
    foreground: "#AEA4BF"
    text: ""
    duration: 0s
    namelength: 0
  - type: path
    style: diamond
    leading_diamond: 
    trailing_diamond: 
    template:  {{ .Path }}
    properties:
      style: folder
    background: "#29315A"
    foreground: "#3EC669"
    text: ""
    duration: 0s
    namelength: 0
  - type: git
    style: diamond
    foreground_templates:
    - "{{ if or (.Working.Changed) (.Staging.Changed) }}#FF9248{{ end }}"
    - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#ff4500{{ end }}"
    - "{{ if gt .Ahead 0 }}#B388FF{{ end }}"
    - "{{ if gt .Behind 0 }}#B388FF{{ end }}"
    leading_diamond: " \ue0b6"
    trailing_diamond: 
    template: " {{ .UpstreamIcon }} {{ .HEAD }} {{if .BranchStatus }} {{ .BranchStatus }}{{ end }} "
    properties:
      branch_max_length: 25.0
      fetch_status: true
    background: "#29315A"
    foreground: "#43CCEA"
    text: ""
    duration: 0s
    namelength: 0
  newline: true
transient_prompt:
  foreground_templates:
    - "{{if gt .Code 0}}red{{end}}"
    - "{{if eq .Code 0}}magenta{{end}}"
  template: "❯ "
