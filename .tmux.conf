set -s escape-time 0
set -g extended-keys-format csi-u

set -g extended-keys on
set -g mouse on

# Enable OSC 52 clipboard passthrough — allows tmux to forward clipboard
# data to the outer terminal over SSH. Required for the tmux-copy OSC 52 fallback.
set -g set-clipboard on

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.tmux.conf
set -g base-index 1

# Open new windows in current pane's directory
bind c new-window -c "#{pane_current_path}"

bind-key -T prefix w choose-tree -Z

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '~/.local/bin/tmux-copy'

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r '(' switch-client -p\; refresh-client -S
bind -r ')' switch-client -n\; refresh-client -S

unbind s
# bind -r s display-popup -E "tms switch"
bind-key -r f display-popup -E "~/.local/bin/tmux-sessionizer"

bind -r m resize-pane -Z

unbind %
bind \\ split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

set -g @tmux_window_name_show_program_args "False"
set -g @tmux_window_name_use_tilde "True"

set -g status-interval 2

set -g status-style "bg=#0a0a0a,fg=#eeeeee"
set -g status-left-style "bg=#0a0a0a,fg=#EC5B2B"
set -g status-right-style "bg=#0a0a0a,fg=#eeeeee"
set -g window-status-style "bg=#0a0a0a,fg=#808080"
set -g window-status-current-style "bg=#EC5B2B,fg=#0a0a0a,bold"
set -g window-status-activity-style "bg=#EE7948,fg=#0a0a0a"
set -g window-status-bell-style "bg=#e06c75,fg=#0a0a0a"
set -g pane-active-border-style "fg=#EC5B2B,bold"
set -g pane-border-style "fg=#3a3a3a"
set -g message-style "bg=#EC5B2B,fg=#0a0a0a"
set -g message-command-style "bg=#EE7948,fg=#0a0a0a"
set -g mode-style "bg=#EC5B2B,fg=#0a0a0a"

# Status line configuration
# set -g status-left '#{prefix_highlight}'
# set -g status-right '#{?window_zoomed_flag,#[fg=#56b6c2]󰊓 #[default],}#{?pane_in_mode,#[fg=#e5c07b]MODE#[default] ,}#P/#I #(tms sessions) %a %Y-%m-%d %H:%M'

# Optional: Use heavy borders for more obvious separation
# set -g pane-border-lines heavy

# Optional: Show pane numbers when switching
# set -g display-panes-time 1000
# set -g display-panes-colour "#3a3a3a"
# set -g display-panes-active-colour "#EC5B2B"
run '~/.tmux/plugins/tpm/tpm'

set -g status-right-length 512
set -g status-right '#(~/.local/bin/tmux-system-status)'
