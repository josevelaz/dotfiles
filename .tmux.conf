set -s escape-time 0

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.config/tmux/.tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r '(' switch-client -p\; refresh-client -S
bind -r ')' switch-client -n\; refresh-client -S

unbind s
bind -r s display-popup -E "tms switch"
bind -r f display-popup -E "tms"

bind -r m resize-pane -Z

unbind %
bind \\ split-window -h 

unbind '"'
bind - split-window -v

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Cyberdream theme colors
set -g status-style "bg=#16181a,fg=#ffffff"
set -g status-left-style "bg=#16181a,fg=#5ea1ff"
set -g status-right-style "bg=#16181a,fg=#ffffff"

# Window status colors
set -g window-status-style "bg=#16181a,fg=#7b8496"
set -g window-status-current-style "bg=#5ea1ff,fg=#16181a,bold"
set -g window-status-activity-style "bg=#ff6e5e,fg=#16181a"
set -g window-status-bell-style "bg=#ffbd5e,fg=#16181a"

# Pane border colors
set -g pane-active-border-style "fg=#5ea1ff,bold"
set -g pane-border-style "fg=#3c4048"

# Message colors
set -g message-style "bg=#5ea1ff,fg=#16181a"
set -g message-command-style "bg=#ff5ef1,fg=#16181a"

# Mode colors (copy mode, etc)
set -g mode-style "bg=#5ea1ff,fg=#16181a"

# Status line configuration
set -g status-left '#{prefix_highlight}'
set -g status-right '#{?window_zoomed_flag, 󰊓 ,}#{?pane_in_mode,#[fg=#ffbd5e]MODE#[default] ,}#P/#I #(tms sessions) %a %Y-%m-%d %H:%M'

# Optional: Use heavy borders for more obvious separation
# set -g pane-border-lines heavy

# Optional: Show pane numbers when switching
set -g display-panes-time 1000
set -g display-panes-colour "#3c4048"
set -g display-panes-active-colour "#5ea1ff"
run '~/.tmux/plugins/tpm/tpm'
