set -s escape-time 0

# Enable OSC 52 clipboard passthrough — allows tmux to forward clipboard
# data to the outer terminal over SSH. Required for the tmux-copy OSC 52 fallback.
set -g set-clipboard on

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.tmux.conf
set -g base-index 1

# Open new windows in current pane's directory
bind c new-window -c "#{pane_current_path}"

bind-key -T prefix w choose-tree -Z

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '~/.local/bin/tmux-copy'

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r '(' switch-client -p\; refresh-client -S
bind -r ')' switch-client -n\; refresh-client -S

unbind s
# bind -r s display-popup -E "tms switch"
bind-key -r f display-popup -E "~/.local/bin/tmux-sessionizer"

bind -r m resize-pane -Z

unbind %
bind \\ split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

set -g @tmux_window_name_show_program_args "False"
set -g @tmux_window_name_use_tilde "True"

set -g @rose_pine_variant 'main'
set -g @rose_pine_status_left_prepend_section '#{tmux_mode_indicator} '
# set -g @rose_pine_show_current_program 'on'
# set -g @rose_pine_show_pane_directory 'on'

