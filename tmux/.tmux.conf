set -s escape-time 0

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g status-style 'bg=default fg=#5eacd3'

bind r source-file ~/.tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r '(' switch-client -p\; refresh-client -S
bind -r ')' switch-client -n\; refresh-client -S

unbind s
bind -r s display-popup -E "tms switch"
bind -r f display-popup -E "tms"

bind -r m resize-pane -Z

unbind %
bind \\ split-window -h 

unbind '"'
bind - split-window -v

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g status-left '#{prefix_highlight}'

set -g window-status-current-format "#[reverse] #I:#W"

# Add these lines to your ~/.tmux.conf

# Pane border colors (using Tokyo Night colors)
# set -g pane-active-border-style "fg=#7aa2f7,bold"  # Bright blue for active
# set -g pane-border-style "fg=#414868"              # Muted gray for inactive

# Dim inactive panes (subtle background difference)
# set -g window-style 'fg=#a9b1d6,bg=#1a1b26'        # Slightly dimmed
# set -g window-active-style 'fg=#c0caf5,bg=#24283b' # Normal brightness

# Enhanced status line with pane info
set -g status-right '#{?window_zoomed_flag, 󰊓 ,}#{?pane_in_mode,#[fg=#ff9e64]MODE#[default] ,}#P/#I #(tms sessions) %a %Y-%m-%d %H:%M'

# Optional: Use heavy borders for more obvious separation
# set -g pane-border-lines heavy

# Optional: Show pane numbers when switching
# set -g display-panes-time 1000
# set -g display-panes-colour "#414868"
# set -g display-panes-active-colour "#7aa2f7"

run '~/.tmux/plugins/tpm/tpm'
