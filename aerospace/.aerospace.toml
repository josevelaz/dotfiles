# ~/.aerospace.toml

# Start AeroSpace at login
start-at-login = true

# Commands to run after login and after startup
after-login-command = []
after-startup-command = ['exec-and-forget borders active_color=0xfff25c00 inactive_color=0xff6e738d width=5.0 &', 'exec-and-forget sketchybar']

exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Tree normalization (keep defaults)
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Gaps: map yabai padding/gap (3px)
[gaps]
    inner.horizontal = 7
    inner.vertical =   7
    outer.left =       7
    outer.bottom =     7
    outer.right =      7
    outer.top =        40
# Mouse behavior: center mouse on focused window when switching monitors
# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# modifier                   = "alt"
# mouse-action1              = "move"
# mouse-action2              = "resize"

# Disable tiling for specific applications
# [[rule]]
# app    = "^1Password$"
# manage = false
# [[rule]]
# app    = "^CleanShotX$"
# manage = false
# [[rule]]
# app    = "^CleanShot X$"
# manage = false

# Main keybindings
[mode.main.binding]
# Changing window focus
  alt-j               = 'focus down'
  alt-k               = 'focus up'
  alt-h               = 'focus left'
  alt-l               = 'focus right'
  cmd-h = [] # Disable "hide application"
  cmd-alt-h = [] # Disable "hide others"

# Modifying the layout
  # shift-alt-r         = 'space.rotate 270'
  # shift-alt-y         = '# mirror y-axis — not supported'
  # shift-alt-x         = '# mirror x-axis — not supported'
  # shift-alt-t         = 'window.toggle-float; window.grid 4:4:1:1:2:2'

# Modifying window size
  shift-alt-m         = 'fullscreen'
  # shift-alt-e         = 'balance-sizes'

# Moving windows around
  shift-alt-j         = 'focus --boundaries-action wrap-around-the-workspace down'
  shift-alt-k         = 'focus --boundaries-action wrap-around-the-workspace up'
  shift-alt-h         = 'focus --boundaries-action wrap-around-the-workspace left'
  shift-alt-l         = 'focus --boundaries-action wrap-around-the-workspace right'

  ctrl-alt-j          = 'move down'
  ctrl-alt-k          = 'move up'
  ctrl-alt-h          = 'move left'
  ctrl-alt-l          = 'move right'

  shift-alt-s         = 'move-node-to-monitor left; display.focus west'
  shift-alt-g         = 'move-node-to-monitor right; display.focus east'
  # shift-alt-p         = 'window.move-space prev'
  # shift-alt-n         = 'window.move-space next'

# Open Obsidian
  shift-alt-o         = 'exec-and-forget open -a /Applications/Obsidian.app'

  # ctrl-alt-q          = 'service stop aerospace'
  # ctrl-alt-s          = 'service start aerospace'
  ctrl-alt-r          = 'reload-config'

# Workspace switching
  ctrl-1               = 'workspace 1'
  ctrl-2               = 'workspace 2'
  ctrl-3               = 'workspace 3'
  ctrl-4               = 'workspace 4'
  ctrl-5               = 'workspace 5'
  ctrl-6               = 'workspace 6'
  ctrl-7               = 'workspace 7'
  ctrl-8               = 'workspace 8'

# Move focused window to workspace
  alt-shift-1         = 'move-node-to-workspace 1'
  alt-shift-2         = 'move-node-to-workspace 2'
  alt-shift-3         = 'move-node-to-workspace 3'
  alt-shift-4         = 'move-node-to-workspace 4'
  alt-shift-5         = 'move-node-to-workspace 5'
  alt-shift-6         = 'move-node-to-workspace 6'
  alt-shift-7         = 'move-node-to-workspace 7'
  alt-shift-8         = 'move-node-to-workspace 8'

# Enter resize mode
  alt-r               = 'mode resize'

[mode.resize.binding]
  h                   = 'resize width  -50'
  j                   = 'resize height +50'
  k                   = 'resize height -50'
  l                   = 'resize width  +50'
  enter               = 'mode main'
  esc                 = 'mode main'
